name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" ruff
      - run: python -m ruff check .
      - run: python -m pytest -q

  python39:
    # 3.9 is still supported; it runs on the older image, which still ships it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install -e ".[test]" ruff
      - run: python -m ruff check .
      - run: python -m pytest -q

  coverage:
    # One job measures coverage so the matrix stays fast; the gate fails the build if a
    # change leaves code the suite never runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" pytest-cov
      - run: python -m pytest -q --cov=zip_deterministic --cov-branch --cov-fail-under=95
