<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="how zip-deterministic works">
  <rect width="720" height="240" rx="16" fill="hsl(262 55% 10%)"/>
  <rect width="720" height="240" rx="16" fill="none" stroke="hsl(262 40% 52%)" stroke-opacity="0.5"/>
  <text x="28" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="3" fill="hsl(316 92% 76%)" opacity="0.8">MESSAGE IN</text>
  <text x="500" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="3" fill="hsl(316 92% 76%)" opacity="0.8">MESSAGE OUT</text>
  <g stroke="hsl(262 40% 52%)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M28 74 h150" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M330 74 h150">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M542 74 h150" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="188" y="46" width="132" height="56" rx="12" fill="hsl(316 88% 62%)" opacity="0.18" stroke="hsl(316 88% 62%)" stroke-opacity="0.8"/>
  <text x="254" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#e2e8f0">zip_deterministic</text>
  <rect x="188" y="132" width="132" height="56" rx="12" fill="none" stroke="hsl(262 40% 52%)" stroke-dasharray="6 6" opacity="0.6"/>
  <text x="254" y="166" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#94a3b8">stdlib only</text>
  <g font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">
    <rect x="28" y="140" width="140" height="48" rx="10" fill="#0f172a" stroke="hsl(262 40% 52%)" stroke-opacity="0.5"/>
    <text x="44" y="170">tool result</text>
    <rect x="542" y="140" width="150" height="48" rx="10" fill="#0f172a" stroke="hsl(262 40% 52%)" stroke-opacity="0.5"/>
    <text x="558" y="170">what you inspect</text>
  </g>
  <circle cx="176" cy="74" r="4" fill="hsl(316 92% 76%)">
    <animate attributeName="cx" values="150;330" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="74" r="4" fill="hsl(316 92% 76%)">
    <animate attributeName="cx" values="330;700" dur="3.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/>
  </circle>
</svg>
