[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zip-deterministic"
version = "0.1.1"
description = "Reproducible zip and tar archives: pinned timestamps, modes and ordering"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["reproducible", "zip", "tar", "deterministic", "archive", "build"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/zip-deterministic"
Issues = "https://github.com/sandeshbagmare/zip-deterministic/issues"
Changelog = "https://github.com/sandeshbagmare/zip-deterministic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/zip_deterministic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
